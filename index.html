    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Safe Service Worker Registration supporting GitHub Pages and subdirectories
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          try {
            const swPath = new URL('./sw.js', window.location.href).href;
            navigator.serviceWorker.register(swPath).then((reg) => {
              console.log('Office PWA Service Worker Registered:', reg.scope);
            }).catch((err) => {
              console.warn('Service Worker registration skipped or failed gracefully:', err);
            });
          } catch (e) {
            console.warn('Service Worker registration error caught:', e);
          }
        });
      }
    </script>
